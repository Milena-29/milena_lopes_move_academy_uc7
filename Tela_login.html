<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Conheça a Move+ Academy! Uma academia completa com infraestrutura moderna, treinos personalizados e professores prontos para acelerar os seus resultados. Na Move+ Academy você encontra o equilíbrio perfeito entre saúde e alta performance. Treinos inteligentes, modalidades variadas e uma comunidade ativa. Comece hoje!">
    <title>Página de login</title>
    <link rel="icon" type="image/png" sizes="32x32" href="img\+.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#00295C">
</head>

<body class="PaginaLogin">

    <div class="FotoLogin">

        <a href="index.html" class="Voltar">
            ← Voltar para o site
        </a>

    </div>

    <div class="Login">

        <img src="img/move+ academyBranca.png" class="LoginLogo">

        <h1>Bem-vindo(a) de volta!</h1>

        <p>Faça login para acessar sua conta</p>

        <label>E-mail</label>
        <input type="email" id="emailLogin" placeholder="Digite seu e-mail">

        <label>Senha</label>
        <input type="password" id="senhaLogin" placeholder="Digite sua senha">

        <button onclick="login()">Entrar</button>

    </div>

    <script src="js/script.js"></script>
</body>

</html>
